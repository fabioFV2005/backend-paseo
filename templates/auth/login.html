<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in · Paseo</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    <script src="{{ url_for('static', filename='js/login.js') }}" defer></script>
  </head>
  <body>
    <main class="auth-shell">
      <section class="auth-card" aria-labelledby="signin-title">
        <h1 id="signin-title" class="auth-title">Sign in to Paseo</h1>
        <p class="auth-subtitle">Use your Google account to continue.</p>

        {% if error_message %}
        <p class="auth-error" role="alert">{{ error_message }}</p>
        {% endif %}

        <a class="btn-google" href="{{ url_for('google_oauth_login') }}"
           data-loading-label="Redirecting to Google&hellip;"
           data-default-label="Continue with Google">
          <span class="btn-google-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg" focusable="false">
              <path fill="#4285F4" d="M17.64 9.2045c0-.6381-.0573-1.2518-.1636-1.8409H9v3.4814h4.8436c-.2086 1.125-.8427 2.0782-1.7959 2.7164v2.2581h2.9087c1.7018-1.5668 2.6836-3.874 2.6836-6.615z"/>
              <path fill="#34A853" d="M9 18c2.43 0 4.4673-.806 5.9564-2.1805l-2.9087-2.2581c-.8059.54-1.8368.859-3.0477.859-2.344 0-4.3282-1.5831-5.036-3.7104H.9574v2.3318C2.4382 15.9832 5.4818 18 9 18z"/>
              <path fill="#FBBC05" d="M3.964 10.71c-.18-.54-.2822-1.1168-.2822-1.71s.1023-1.17.2823-1.71V4.9582H.9573C.3477 6.1732 0 7.5477 0 9s.3477 2.8268.9573 4.0418L3.964 10.71z"/>
              <path fill="#EA4335" d="M9 3.5795c1.3214 0 2.5077.4541 3.4405 1.346l2.5813-2.5814C13.4632.8918 11.426 0 9 0 5.4818 0 2.4382 2.0168.9573 4.9582L3.964 7.29C4.6718 5.1631 6.656 3.5795 9 3.5795z"/>
            </svg>
          </span>
          <span class="btn-google-spinner spinner" aria-hidden="true">
            <span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span>
          </span>
          <span class="btn-google-label">Continue with Google</span>
        </a>

        <p class="auth-legal">By continuing, Google shares your name and email address with Paseo.</p>
      </section>
    </main>
  </body>
</html>
