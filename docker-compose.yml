services:
  postgres:
    # Same image already used on this machine: no extra download needed.
    image: postgres:16.2
    container_name: paseo-aranjuez-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: paseo
      POSTGRES_PASSWORD: paseo123
      POSTGRES_DB: paseo_aranjuez
    ports:
      # Host port 5440 avoids clashing with other local Postgres containers.
      - "5440:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paseo -d paseo_aranjuez"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
