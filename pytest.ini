[pytest]
# Make the project root importable so `import app` works from tests/ regardless
# of how pytest is invoked. `pythonpath` needs pytest >= 7.
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# -q keeps the output readable; --strict-markers catches a typo'd @pytest.mark
# that would otherwise be silently ignored.
addopts = -q --strict-markers
filterwarnings =
    # SQLAlchemy warns that SQLite stores Numeric as float. Expected and
    # accepted: the ledger and order totals are still computed with Decimal in
    # Python, so no rounding error reaches the application.
    ignore::sqlalchemy.exc.SAWarning
